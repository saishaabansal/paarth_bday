

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>for paarth ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>

    :root {

      --yellow: #FFF1B8;

      --blue: #A9D2EC;

      --red: #C83B4B;

      --ink: #29272A;

      --paper: #FFFCF5;

    }

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      min-height: 100dvh;

      background: var(--yellow);

      color: var(--ink);

      font-family: "DM Sans", sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

    }

    .page {

      width: 100%;

      max-width: 360px;

      text-align: center;

    }

    .heading {

      font-family: "Cormorant Garamond", serif;

      font-size: 32px;

      font-weight: 600;

      letter-spacing: .2px;

      margin-bottom: 8px;

    }

    .hint {

      font-family: "Lora", serif;

      font-size: 14px;

      font-style: italic;

      line-height: 1.7;

      margin: 0 0 26px;

      color: #655B43;

    }

    .pad {

      background: var(--blue);

      border: 2px solid var(--ink);

      border-radius: 28px;

      padding: 24px 18px 20px;

      box-shadow: 5px 5px 0 var(--ink);

    }

    .display {

      background: var(--paper);

      border: 2px solid var(--ink);

      border-radius: 15px;

      height: 53px;

      margin-bottom: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

    }

    .dot {

      font-size: 17px;

      color: var(--ink);

    }

    .keys {

      display: grid;

      grid-template-columns: repeat(3, 62px);

      justify-content: center;

      gap: 12px;

    }

    .key {

      width: 62px;

      height: 62px;

      border: 2px solid var(--ink);

      border-radius: 50%;

      background: var(--paper);

      font: 600 19px "DM Sans", sans-serif;

      color: var(--ink);

      cursor: pointer;

      box-shadow: 0 3px 0 var(--ink);

      transition: transform .12s, box-shadow .12s;

      -webkit-tap-highlight-color: transparent;

    }

    .key:active {

      transform: translateY(3px);

      box-shadow: none;

    }

    .key.clear {

      background: #F8E6A1;

      font-size: 20px;

    }

    .key.enter {

      background: var(--red);

      color: white;

      font-size: 23px;

    }

    .message {

      min-height: 25px;

      margin-top: 19px;

      font-size: 14px;

      font-weight: 600;

    }

    .next-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin-top: 22px;

      padding: 12px 23px;

      border: 1.5px solid var(--ink);

      border-radius: 30px;

      background: var(--paper);

      color: var(--ink);

      font-family: "Lora", serif;

      font-size: 15px;

      cursor: pointer;

      opacity: 0;

      visibility: hidden;

      transform: translateY(7px);

      transition:

        opacity .4s ease,

        transform .4s ease,

        background .2s ease,

        visibility .4s;

      -webkit-tap-highlight-color: transparent;

    }

    .next-button.show {

      opacity: 1;

      visibility: visible;

      transform: translateY(0);

    }

    .next-button:hover {

      background: #FFF6D9;

    }

    .arrow {

      font-family: "DM Sans", sans-serif;

      font-size: 20px;

      transition: transform .2s ease;

    }

    .next-button:hover .arrow {

      transform: translateX(4px);

    }

    @media (max-width: 380px) {

      .keys {

        grid-template-columns: repeat(3, 56px);

        gap: 12px;

      }

      .key {

        width: 56px;

        height: 56px;

      }

      .heading {

        font-size: 29px;

      }

      .pad {

        padding: 21px 14px 17px;

      }

    }

  </style>

</head>

<body>

  <main class="page">

    <div class="heading">click to enter the password</div>

    <p class="hint">

      our favouriteeee dayyyyy (pichle saal ka tho)

    </p>

    <section class="pad">

      <div class="display" id="display" aria-label="Password entry">

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

        <span class="dot">○</span>

      </div>

      <div class="keys">

        <button class="key" onclick="pressNumber('1')">1</button>

        <button class="key" onclick="pressNumber('2')">2</button>

        <button class="key" onclick="pressNumber('3')">3</button>

        <button class="key" onclick="pressNumber('4')">4</button>

        <button class="key" onclick="pressNumber('5')">5</button>

        <button class="key" onclick="pressNumber('6')">6</button>

        <button class="key" onclick="pressNumber('7')">7</button>

        <button class="key" onclick="pressNumber('8')">8</button>

        <button class="key" onclick="pressNumber('9')">9</button>

        <button class="key clear" onclick="clearPassword()" aria-label="Delete last digit">⌫</button>

        <button class="key" onclick="pressNumber('0')">0</button>

        <button class="key enter" onclick="checkPassword()" aria-label="Enter password">↵</button>

      </div>

      <div class="message" id="message" aria-live="polite"></div>

    </section>

    <button

      class="next-button"

      id="nextButton"

      onclick="goToNextPage()"

      type="button"

    >

      <span>next page</span>

      <span class="arrow">→</span>

    </button>

  </main>

  <script>

    const correctPassword = "16102025";

    let enteredPassword = "";

    let unlocked = false;

    const display = document.getElementById("display");

    const message = document.getElementById("message");

    const nextButton = document.getElementById("nextButton");

    function updateDisplay() {

      display.innerHTML = "";

      for (let i = 0; i < 8; i++) {

        const dot = document.createElement("span");

        dot.className = "dot";

        dot.textContent = i < enteredPassword.length ? "●" : "○";

        display.appendChild(dot);

      }

    }

    function pressNumber(number) {

      if (unlocked || enteredPassword.length >= 8) return;

      enteredPassword += number;

      updateDisplay();

      message.textContent = "";

      message.style.color = "";

    }

    function clearPassword() {

      if (unlocked) return;

      enteredPassword = enteredPassword.slice(0, -1);

      updateDisplay();

      message.textContent = "";

      message.style.color = "";

    }

    function checkPassword() {

      if (unlocked) return;

      if (enteredPassword.length !== 8) {

        message.textContent = "enter all 8 digits first :)";

        message.style.color = "#C83B4B";

        return;

      }

      if (enteredPassword === correctPassword) {

        unlocked = true;

        message.textContent = "YAAYYYY CORRECT :)";

        message.style.color = "#29272A";

        nextButton.classList.add("show");

      } else {

        message.textContent = "incorrect :(";

        message.style.color = "#C83B4B";

        setTimeout(() => {

          if (unlocked) return;

          enteredPassword = "";

          updateDisplay();

          message.textContent = "";

        }, 1800);

      }

    }

    function goToNextPage() {

      if (!unlocked) return;

      window.location.href = "birthday.html";

    }

  </script>

</body>

</html>
